name: DCI Screenshot Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: "10 22 * * *"

permissions:
  contents: write

jobs:
  schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tweetkit-x

      - name: Check cookie secret
        env:
          X_COOKIE_B64: ${{ secrets.X_COOKIE_B64 }}
        run: |
          python - <<'PY'
          import os
          import base64

          raw = os.environ.get("X_COOKIE_B64", "")
          print("Secret 字符数:", len(raw))
          print("前后空白后字符数:", len(raw.strip()))

          try:
              data = base64.b64decode(raw.strip(), validate=True)
              print("Base64 解码成功")
              print("解码后字节数:", len(data))
              print("是否以 JSON 开头:", data.lstrip().startswith(b"{"))
          except Exception as e:
              print("Base64 解码失败:", e)
          PY

      - name: Run scheduler
        env:
          X_COOKIE_B64: ${{ secrets.X_COOKIE_B64 }}
        run: |
          python scheduler.py

      - name: Commit updated schedule state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scheduled.json
          git diff --cached --quiet || git commit -m "Update scheduled posts"
          git push
