name: DCI Screenshot Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: "29 2,14 * * *"

permissions:
  contents: write

jobs:
  schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tweetkit-x

      - name: Run scheduler
        env:
          X_COOKIE_JSON: ${{ secrets.X_B64 }}
        run: |
          python scheduler.py

      - name: Commit updated schedule state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scheduled.json
          git diff --cached --quiet || git commit -m "Update scheduled posts"
          git push